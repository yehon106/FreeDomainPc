name: Build and publish FD.msi

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FreeDomainServer --collect-all requests --collect-all keyring --hidden-import keyring.backends.Windows --paths . launcher.py
      - name: Install WiX Toolset v4 and UI extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the MSI installer
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build installer.wxs -arch x64 -ext WixToolset.UI.wixext -o dist/FD.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish FD.msi on the GitHub Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FreeDomain Server 1.0.0
          body: |
            Download **FD.msi** and double-click it to install FreeDomain Server using the standard Windows Installer wizard.
          files: dist/FD.msi
          make_latest: true
          fail_on_unmatched_files: true
